name: Feature request
description: Suggest features you want the developers (or contributors) to make for the launcher.
labels: [feature-request, 'status: needs triage']
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Open Launcher's issue tracker is maintained on a best-effort basis — due to limited resources, we do not guarantee that all issues will be triaged or checked by the developers.
        > Open Launcher intentionally stays minimal (desktop, app drawer, and the Blink feed plugin); requests outside that scope are unlikely to be accepted.

        Thanks for taking the time to file this issue! Here are a few things to do before submitting:
        1. Make sure you are using the [**latest build**](https://github.com/wustar576/open-launcher/releases) when requesting.
        2. Search **both [open and closed issues](https://github.com/wustar576/open-launcher/issues?q=is%3Aissue+sort%3Aupdated-desc+)** for your feature request.

        Please keep in mind that **we may not always implement this feature request**.

  - type: textarea
    id: feature-description
    attributes:
      label: Describe the feature
      description: A clear and concise description of what the feature is.
    validations:
      required: true

  - type: textarea
    id: feature-usefulness
    attributes:
      label: Why would it be useful to add?
      description: Explain why this feature would be useful to you
    validations:
      required: true

  - type: textarea
    id: feature-examples
    attributes:
      label: Example(s)
      description: Post screenshots/drawings/links/etc of the feature request, or proof-of-concept images about the feature.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the feature here.
    validations:
      required: false
